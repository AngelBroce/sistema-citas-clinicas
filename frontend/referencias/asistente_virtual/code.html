<span class="w-2 h-2 rounded-full bg-tertiary-container inline-block"></span> En línea
                </p>
</div>

<button class="text-on-surface-variant dark:text-outline-variant hover:bg-surface-variant/20 transition-all duration-200 active:scale-95 p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="more_vert" style="font-variation-settings: 'FILL' 0;">more_vert</span>
</button>

<div class="flex-grow overflow-y-auto px-margin-mobile py-lg pb-32 flex flex-col gap-lg">

<span class="bg-surface-container px-4 py-1 rounded-full font-label-md text-label-md text-on-surface-variant">Hoy</span>
</div>
<!-- Bot Message -->

<div class="bg-surface-container rounded-2xl rounded-tl-sm p-4 shadow-[0_2px_8px_rgba(0,0,0,0.04)]">
<p class="font-body-md text-body-md text-on-surface">

                    </p>
</div>
<span class="font-body-sm text-body-sm text-outline px-1">10:42 AM</span>
</div>
<!-- Quick Replies (Bento-ish Grid layout for options) -->

<span class="material-symbols-outlined text-[20px]" data-icon="medical_information">medical_information</span>
</div>
<span class="font-label-md text-label-md text-primary">Dudas de síntomas</span>

<button class="bg-surface-container-lowest border border-outline-variant rounded-xl p-3 flex items-center gap-3 hover:border-primary focus:border-primary transition-colors text-left shadow-[0_2px_8px_rgba(0,0,0,0.04)]">
<div class="bg-primary-fixed text-on-primary-fixed-variant rounded-full p-2 flex-shrink-0">
